name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (publishConfig.provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # `prepare` builds dist/ on install; the explicit build below keeps it
      # obvious and independent of npm lifecycle ordering.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Public scoped package: access (public) and provenance come from
      # package.json publishConfig. NPM_TOKEN must have publish rights to the
      # @synervoz scope.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
