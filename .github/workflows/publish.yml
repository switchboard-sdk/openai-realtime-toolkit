name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance (publishConfig.provenance)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # `prepare` builds dist/ on install; the explicit build below keeps it
      # obvious and independent of npm lifecycle ordering.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: auth comes from the OIDC token above via npm trusted
      # publishing, configured on npmjs.com for this repo + workflow. Node 22's
      # bundled npm predates that support, hence npm@latest.
      - name: Publish
        run: npx --yes npm@latest publish
